version: v2
modules:
  - path: .
    name: buf.build/temporalio/api
    excludes:
      # Vendored for api-linter (can't read the BSR); excluded so buf sees them once.
      - google
      - nexusannotations
      - buf
deps:
  - buf.build/googleapis/googleapis
  - buf.build/temporalio/nexus-annotations
  - buf.build/bufbuild/protovalidate:435963d1631043e694e56e6bcc3c79c3
lint:
  use:
    - STANDARD
    - PROTOVALIDATE
  ignore:
    - cmd
    - google
  disallow_comment_ignores: true
breaking:
  use:
    - WIRE_JSON
  ignore:
    - google
